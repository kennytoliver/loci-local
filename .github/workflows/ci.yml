name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法检查（引擎 + 面板 + 安装器）
        run: |
          python -m py_compile loci.py panel.py install_agents.py

      - name: 引擎端到端测试（MCP 协议 / 中文检索 / 会话层）
        run: python test_mcp.py

      - name: 面板回归测试（JS 语法守卫 / 元素完整性 / 路由 / 零依赖）
        run: python test_panel.py

      # 召回质量回归护栏（2026-10-11 加）。
      # 为什么单独把它挑进 CI：它是唯一衡量"记忆找得回来吗"的闸门，且零依赖、纯 Python、
      # 几秒跑完 —— 正好适合 CI。其余 30 项闸门需要真实面板进程 / node / 截图，
      # 不适合放进这个矩阵，仍然靠本地 `bash tools/run_gates.sh` 跑。
      - name: 召回质量（低于基线则失败）
        run: python tools/eval_recall.py --gate

      - name: 命令行安装器自检
        shell: bash
        run: |
          python install_agents.py --list
          python install_agents.py --verify
